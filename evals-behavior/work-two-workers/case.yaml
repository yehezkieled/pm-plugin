schema_version: "1"
name: work-two-workers
description: Two independent ready items go to two pm:worker agents in their own worktrees; the coordinating session edits nothing.
tags: [behavior, workers, work]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Work on both ready items on the board."
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit, Agent]
